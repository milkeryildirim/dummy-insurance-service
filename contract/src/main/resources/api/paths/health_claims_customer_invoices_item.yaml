get:
  tags:
    - HealthClaims
  summary: "Get a specific customer invoice for a health claim"
  operationId: "getHealthClaimCustomerInvoiceById"
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ClaimId'
    - $ref: '../openapi.yaml#/components/parameters/InvoiceId'
  responses:
    '200':
      description: "Health claim customer invoice details"
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CustomerInvoiceDto.yaml'
    '404':
      description: "Health claim or customer invoice not found"

put:
  tags:
    - HealthClaims
  summary: "Update a customer invoice for a health claim"
  operationId: "updateHealthClaimCustomerInvoice"
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ClaimId'
    - $ref: '../openapi.yaml#/components/parameters/InvoiceId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/CustomerInvoiceDto.yaml'
  responses:
    '200':
      description: "Health claim customer invoice updated successfully"
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CustomerInvoiceDto.yaml'
    '404':
      description: "Health claim or customer invoice not found"

delete:
  tags:
    - HealthClaims
  summary: "Delete a customer invoice for a health claim"
  operationId: "deleteHealthClaimCustomerInvoice"
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ClaimId'
    - $ref: '../openapi.yaml#/components/parameters/InvoiceId'
  responses:
    '204':
      description: "Health claim customer invoice deleted successfully"
    '404':
      description: "Health claim or customer invoice not found"