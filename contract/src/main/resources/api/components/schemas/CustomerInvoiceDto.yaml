type: object
description: "Data Transfer Object for Customer Invoice information"
properties:
  id:
    type: integer
    format: int64
    readOnly: true
    example: 1
  claimId:
    type: integer
    format: int64
    description: "The ID of the claim this invoice belongs to"
    example: 1001
  description:
    type: string
    description: "Description of what this invoice is for"
    maxLength: 500
    example: "Repair invoice from AutoShop Berlin for front bumper replacement"
  invoiceAmount:
    type: number
    format: decimal
    description: "Amount stated on the invoice"
    example: 1150.00
    nullable: true
  invoiceDate:
    type: string
    format: date
    description: "Date on the invoice"
    example: "2025-10-20"
    nullable: true
  vendorName:
    type: string
    description: "Name of the vendor who issued the invoice"
    maxLength: 255
    example: "AutoShop Berlin GmbH"
    nullable: true
  invoicePdfPath:
    type: string
    description: "Path to the uploaded PDF invoice file"
    maxLength: 500
    nullable: true
    readOnly: true
  originalPdfFilename:
    type: string
    description: "Original filename of the uploaded PDF"
    maxLength: 255
    nullable: true
    readOnly: true
  uploadedAt:
    type: string
    format: date-time
    readOnly: true
    description: "When the invoice was uploaded"
    example: "2025-10-25T21:20:04Z"
required:
  - claimId
  - description