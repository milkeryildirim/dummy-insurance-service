type: object
description: "Data Transfer Object for Claim Decision information"
properties:
  id:
    type: integer
    format: int64
    readOnly: true
    example: 1
  claimId:
    type: integer
    format: int64
    description: "The ID of the claim this decision is for"
    example: 1001
  decisionMakerId:
    type: integer
    format: int64
    description: "The ID of the employee who made the decision"
    example: 10
  decisionMakerName:
    type: string
    readOnly: true
    description: "Full name of the decision maker"
    example: "Sabine Meier"
  decisionType:
    type: string
    enum: [ APPROVED, PARTIALLY_APPROVED, REJECTED, REQUIRES_MORE_INFO, UNDER_INVESTIGATION ]
    description: "Type of decision made"
    example: "APPROVED"
  approvedAmount:
    type: number
    format: decimal
    description: "Amount approved for payout (if applicable)"
    example: 1000.00
    nullable: true
  reasoning:
    type: string
    description: "Reasoning behind the decision"
    maxLength: 2000
    example: "Claim approved based on adjuster report and submitted invoices. Amount reduced due to policy deductible."
  rejectionReason:
    type: string
    description: "Specific reason for rejection (if decision is rejected)"
    maxLength: 1000
    nullable: true
    example: "Damage not covered under current policy terms"
  additionalNotes:
    type: string
    description: "Additional notes about the decision"
    maxLength: 1000
    nullable: true
  decisionDate:
    type: string
    format: date-time
    readOnly: true
    description: "When the decision was made"
    example: "2025-10-25T21:20:04Z"
  updatedAt:
    type: string
    format: date-time
    readOnly: true
    description: "When the decision was last updated"
    example: "2025-10-25T21:20:04Z"
required:
  - claimId
  - decisionMakerId
  - decisionType
  - reasoning