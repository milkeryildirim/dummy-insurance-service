get:
  tags:
    - HomeClaims
  summary: "Get a specific customer invoice for a home claim"
  operationId: "getHomeClaimCustomerInvoiceById"
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ClaimId'
    - $ref: '../openapi.yaml#/components/parameters/InvoiceId'
  responses:
    '200':
      description: "Home claim customer invoice details"
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CustomerInvoiceDto.yaml'
    '404':
      description: "Home claim or customer invoice not found"

put:
  tags:
    - HomeClaims
  summary: "Update a customer invoice for a home claim"
  operationId: "updateHomeClaimCustomerInvoice"
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ClaimId'
    - $ref: '../openapi.yaml#/components/parameters/InvoiceId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/CustomerInvoiceDto.yaml'
  responses:
    '200':
      description: "Home claim customer invoice updated successfully"
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CustomerInvoiceDto.yaml'
    '404':
      description: "Home claim or customer invoice not found"

delete:
  tags:
    - HomeClaims
  summary: "Delete a customer invoice for a home claim"
  operationId: "deleteHomeClaimCustomerInvoice"
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ClaimId'
    - $ref: '../openapi.yaml#/components/parameters/InvoiceId'
  responses:
    '204':
      description: "Home claim customer invoice deleted successfully"
    '404':
      description: "Home claim or customer invoice not found"