get:
  tags:
    - HomeClaims
  summary: "Get the decision for a home claim"
  operationId: "getHomeClaimDecision"
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ClaimId'
  responses:
    '200':
      description: "Home claim decision details"
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ClaimDecisionDto.yaml'
    '404':
      description: "Home claim or decision not found"

post:
  tags:
    - HomeClaims
  summary: "Create a decision for a home claim"
  operationId: "createHomeClaimDecision"
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ClaimId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/ClaimDecisionDto.yaml'
  responses:
    '201':
      description: "Home claim decision created successfully"
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ClaimDecisionDto.yaml'
    '400':
      description: "Invalid input data"
    '404':
      description: "Home claim not found"
    '409':
      description: "Decision already exists for this home claim"

put:
  tags:
    - HomeClaims
  summary: "Update the decision for a home claim"
  operationId: "updateHomeClaimDecision"
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ClaimId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/ClaimDecisionDto.yaml'
  responses:
    '200':
      description: "Home claim decision updated successfully"
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ClaimDecisionDto.yaml'
    '404':
      description: "Home claim or decision not found"