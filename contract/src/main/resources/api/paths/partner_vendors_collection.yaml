get:
  summary: "Get all partner vendors"
  description: "Retrieve a list of all partner vendors with optional filtering and pagination"
  tags:
    - "PartnerVendors"
  parameters:
    - name: page
      in: query
      description: "Page number for pagination"
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    - name: size
      in: query
      description: "Page size for pagination"
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    - name: vendorType
      in: query
      description: "Filter by vendor type"
      required: false
      schema:
        type: string
        enum:
          - AUTO_REPAIR
          - MEDICAL_PROVIDER
          - CONSTRUCTION_CONTRACTOR
          - ELECTRICAL_CONTRACTOR
          - PLUMBING_CONTRACTOR
          - ROOFING_CONTRACTOR
          - CLEANING_SERVICE
          - RESTORATION_SERVICE
          - LEGAL_SERVICE
          - TOWING_SERVICE
          - PARTS_SUPPLIER
          - OTHER
    - name: status
      in: query
      description: "Filter by vendor status"
      required: false
      schema:
        type: string
        enum:
          - ACTIVE
          - INACTIVE
          - SUSPENDED
          - PENDING_APPROVAL
  responses:
    '200':
      description: "Successfully retrieved partner vendors"
      content:
        application/json:
          schema:
            type: object
            properties:
              content:
                type: array
                items:
                  $ref: '../components/schemas/PartnerVendorDto.yaml'
              totalElements:
                type: integer
                format: int64
              totalPages:
                type: integer
              size:
                type: integer
              number:
                type: integer
              first:
                type: boolean
              last:
                type: boolean
    '400':
      description: "Invalid query parameters"

post:
  summary: "Create a new partner vendor"
  description: "Create a new partner vendor in the system"
  tags:
    - "PartnerVendors"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/PartnerVendorDto.yaml'
  responses:
    '201':
      description: "Partner vendor created successfully"
      content:
        application/json:
          schema:
            $ref: '../components/schemas/PartnerVendorDto.yaml'
    '400':
      description: "Invalid input or vendor code already exists"
    '422':
      description: "Validation error"