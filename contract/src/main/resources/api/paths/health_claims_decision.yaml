get:
  tags:
    - HealthClaims
  summary: "Get the decision for a health claim"
  operationId: "getHealthClaimDecision"
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ClaimId'
  responses:
    '200':
      description: "Health claim decision details"
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ClaimDecisionDto.yaml'
    '404':
      description: "Health claim or decision not found"

post:
  tags:
    - HealthClaims
  summary: "Create a decision for a health claim"
  operationId: "createHealthClaimDecision"
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ClaimId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/ClaimDecisionDto.yaml'
  responses:
    '201':
      description: "Health claim decision created successfully"
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ClaimDecisionDto.yaml'
    '400':
      description: "Invalid input data"
    '404':
      description: "Health claim not found"
    '409':
      description: "Decision already exists for this health claim"

put:
  tags:
    - HealthClaims
  summary: "Update the decision for a health claim"
  operationId: "updateHealthClaimDecision"
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ClaimId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/ClaimDecisionDto.yaml'
  responses:
    '200':
      description: "Health claim decision updated successfully"
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ClaimDecisionDto.yaml'
    '404':
      description: "Health claim or decision not found"